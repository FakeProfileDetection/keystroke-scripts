[project]
name = "keystroke-scripts"
version = "1.0.0"
description = "ML experiments for keystroke biometrics user identification"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

dependencies = [
    # Core scientific computing
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "polars>=0.20.0",
    "scipy>=1.7.0",

    # Machine Learning
    "scikit-learn>=1.0.0",
    "xgboost>=1.5.0",
    "lightgbm>=3.3.0",
    "catboost>=1.0.0",

    # Deep Learning (for GPU check)
    "torch>=1.10.0",

    # Data handling
    "pyarrow>=6.0.0",

    # Visualization
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "plotly>=5.0.0",
    "rich>=13.0.0",

    # Utilities
    "joblib>=1.1.0",

    # Biometric evaluation (optional but used for recognition_rate metric)
    "bob.measure>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.0",
    "black>=21.0",
    "flake8>=4.0.0",
]

[project.scripts]
ml-runner = "ml_runner:main"
ml-scenario-runner = "ml_scenario_runner:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Include all .py files in the root directory as modules
py-modules = [
    "ml_runner",
    "ml_scenario_runner",
    "ml_core",
    "ml_visualizer",
    "ml_utils",
    "ml_models",
    "ml_platforms_core",
    "ml_platforms_runner",
    "ml_platforms_visualizer",
    "scenarios",
    "feature_dataset_preparer",
    "alpha_bigrams_gen",
    "extended_minmax",
    "feature_table",
    "hbos",
    "kht_nan_zero",
    "kit_heatmap",
    "lori_keystroke_features",
]

[tool.setuptools.package-data]
"*" = ["*.json", "*.csv"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
