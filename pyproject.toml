[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keystroke-scripts"
version = "1.0.0"
description = "ML experiments for keystroke biometrics"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "polars>=0.19.0",
    "pyarrow>=14.0.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "catboost>=1.2.0",
    "lightgbm>=4.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.18.0",
    "rich>=13.0.0",
    "torch>=2.0.0",
    "bob.measure>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.scripts]
ml-runner = "ml_runner:main"
ml-scenario-runner = "ml_scenario_runner:main"

[tool.setuptools]
py-modules = [
    "ml_runner",
    "ml_scenario_runner",
    "ml_core",
    "ml_visualizer",
    "ml_utils",
    "ml_models",
    "scenarios",
    "feature_dataset_preparer",
    "alpha_bigrams_gen",
    "extended_minmax",
    "feature_table",
    "hbos",
    "kht_nan_zero",
    "kit_heatmap",
    "lori_keystroke_features",
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
