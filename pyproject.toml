[project]
name = "fusion-id"
version = "0.1.0"
description = "Multi-Modal Fusion System for User Identification using Keystroke Dynamics and Text Analysis"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = [
    "biometrics",
    "keystroke dynamics",
    "text analysis",
    "user identification",
    "multi-modal fusion",
    "machine learning"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

dependencies = [
    # Core scientific computing
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "polars>=0.20.0",
    "scipy>=1.7.0",

    # Machine Learning
    "scikit-learn>=1.0.0",
    "xgboost>=1.5.0",
    "lightgbm>=3.3.0",
    "catboost>=1.0.0",

    # Deep Learning (optional)
    "torch>=1.10.0",

    # Data handling
    "pyarrow>=6.0.0",
    "pyyaml>=5.4.0",
    "python-dotenv>=0.19.0",

    # API and networking
    "requests>=2.26.0",
    "aiohttp>=3.8.0",

    # Visualization
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "plotly>=5.0.0",

    # Utilities
    "tqdm>=4.62.0",
    "joblib>=1.1.0",
    "click>=8.0.0",
    "loguru>=0.5.3",
    "tabulate>=0.9.0",

    # Biometric evaluation
    "bob.measure>=5.0.0",

    # Jupyter support
    "jupyter>=1.0.0",
    "nbconvert>=6.0.0",
    "ipykernel>=6.0.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=6.2.0",
    "pytest-cov>=3.0.0",
    "pytest-mock>=3.6.0",
    "pytest-asyncio>=0.18.0",

    # Code quality
    "black>=21.0",
    "flake8>=4.0.0",
    "mypy>=0.910",
    "isort>=5.10.0",
    "pylint>=2.12.0",

    # Documentation
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "sphinx-autodoc-typehints>=1.12.0",
]

gpu = [
    "torch>=1.10.0",
    "torchvision>=0.11.0",
    "cuda-python>=11.0",
]

experiment = [
    "mlflow>=1.20.0",
    "wandb>=0.12.0",
    "tensorboard>=2.8.0",
]

[project.scripts]
fusion-id = "src.cli:main"
fusion-experiment = "experiments.run_all:main"

[project.urls]
Homepage = "https://github.com/yourusername/fusion_id"
Documentation = "https://fusion-id.readthedocs.io"
Repository = "https://github.com/yourusername/fusion_id"
Issues = "https://github.com/yourusername/fusion_id/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}
packages = {find = {where = ["src"], exclude = ["tests*"]}}

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "*.txt"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.venv
  | build
  | dist
  | data
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true
exclude = [
    "tests/",
    "build/",
    "dist/",
    "data/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "-v",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring GPU",
    "integration: marks integration tests",
    "unit: marks unit tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/config.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "pass",
]

[tool.pylint.messages_control]
max-line-length = 100
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0903",  # too-few-public-methods
    "R0913",  # too-many-arguments
    "W0622",  # redefined-builtin
]

[tool.ruff]
line-length = 100
target-version = "py38"
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    "data",
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]